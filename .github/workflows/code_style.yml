name: Pylint

# Report-only: this workflow never modifies, commits or pushes code.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run pylint
        run: |
          git ls-files -z '*.py' | xargs -0 pylint --rcfile=.pylintrc --output-format=json2 > pylint_output.json
          python .github/scripts/pylint_summary.py pylint_output.json > lint_summary.md
          cat lint_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pylint report
        uses: actions/upload-artifact@v7
        with:
          name: pylint-report
          path: pylint_output.json

      - name: Find previous pylint comment
        if: github.event_name == 'pull_request'
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- pylint-summary -->"

      - name: Post pylint summary as PR comment
        if: github.event_name == 'pull_request'
        # PRs from forks get a read-only token; don't fail the job over that.
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body-path: lint_summary.md
