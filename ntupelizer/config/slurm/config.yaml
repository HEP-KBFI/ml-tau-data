# SLURM executor profile for Snakemake 7.x
# Usage: snakemake --profile workflow/profiles/slurm

cluster: >-
    sbatch
    --parsable
    --export=ALL
    --output=logs/slurm/{rule}_{wildcards}_%j.out
    --error=logs/slurm/{rule}_{wildcards}_%j.err
    --partition=main
    --job-name=smk-{rule}
    --time={resources.runtime}
    --mem={resources.mem_mb}M
    --cpus-per-task={resources.cpus}

default-resources:
    - runtime=15
    # 3 GB covers the ntupelize jobs, which are the only ones that take this
    # default: the highest MaxRSS over a 100-file test run was 2447 MiB, on a
    # background (qq) batch. The files of a batch are processed one at a time, so
    # this does not need to grow with files_per_job.
    - mem_mb=3000
    - cpus=1

cluster-status: "ntupelizer/scripts/slurm_status.py"
cluster-cancel: "scancel"
jobscript: "ntupelizer/config/slurm/jobscript.sh"
jobs: unlimited
max-jobs-per-second: 50
max-status-checks-per-second: 5
latency-wait: 60
restart-times: 1
group-components:
    - ntupelize=20
